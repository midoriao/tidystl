[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "tidystl-simd"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["tidystl>=0.1", "numpy>=1.24"]

[tool.maturin]
module-name = "tidystl_simd._ext"

[tool.uv.sources]
# Resolve tidystl from the repo root during development; the PyPI
# requirement above applies when this package is installed standalone.
# Editable to match the root project's own editable source (uv rejects
# conflicting editable/non-editable URLs when this is a path dependency).
tidystl = { path = "../..", editable = true }
