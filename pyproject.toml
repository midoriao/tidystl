[project]
name = "tidystl"
version = "0.1.0"
description = "STL robustness evaluation with explicit semantics."
readme = "README.md"
authors = [{ name = "Sota Sato" }]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "signal-temporal-logic",
    "stl",
    "robustness",
    "monitoring",
    "runtime-verification",
    "falsification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24", "lark>=1.1"]

[project.optional-dependencies]
torch = ["torch>=2.0"]

[project.urls]
Homepage = "https://github.com/midoriao/tidystl"
Repository = "https://github.com/midoriao/tidystl"
Issues = "https://github.com/midoriao/tidystl/issues"

[dependency-groups]
dev = [
    "matplotlib>=3.9",
    "pytest>=7.0",
    "ruff>=0.1.0",
    "pyright>=1.1",
    "jupyterlab>=4.5.7",
    "maturin>=1.13.3",
    "tyro>=1.0.13",
]

experiments = ["stlcgpp==0.0.2", "rtamt==0.3.5", "tyro>=1.0.13", "tidystl-simd"]

[tool.uv.sources]
tidystl-simd = { path = "extra/tidystl_simd", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tidystl"]

[tool.hatch.build.targets.sdist]
# Explicit allowlist so the sdist is deterministic and never sweeps in
# untracked local-only directories (editor/IDE/agent config, build caches,
# worktrees) that happen to sit in the working tree at build time.
include = [
    "src",
    "tests",
    "README.md",
    "LICENSE",
    "CITATION.cff",
    "pyproject.toml",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["src", "tests", "examples"]
ignore = ["src/tidystl/backends/stlcgpp.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--strict-markers", "--tb=short", "--import-mode=importlib"]
