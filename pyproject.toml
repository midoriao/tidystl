[project]
name = "tidystl-workspace"
version = "0.0.0"
description = "Repository workspace for tidystl packages, experiments, docs, and paper artifacts."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "tidystl",
    "tidystl-compat",
    "matplotlib>=3.9",
    "pytest>=7.0",
    "ruff>=0.1.0",
    "pyright>=1.1",
]

experiments = [
    "tidystl",
    "tidystl-compat",
    "tidystl-simd",
    "stlcgpp==0.0.2",
    "rtamt==0.3.5",
    "tyro>=1.0.13",
    "metric-temporal-logic>=0.4.1",
    "scipy>=1.13",
    "cma>=3.3",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/tidystl",
    "packages/tidystl-compat",
    "packages/tidystl-simd",
]

[tool.uv.sources]
tidystl = { workspace = true }
tidystl-compat = { workspace = true }
tidystl-simd = { workspace = true }

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = [
    "packages/tidystl/src",
    "packages/tidystl/tests",
    "packages/tidystl-compat/tidystl_compat",
    "packages/tidystl-compat/tests",
    "examples",
]
ignore = ["packages/tidystl-compat/tidystl_compat/stlcgpp.py"]
extraPaths = [".", "packages/tidystl/src", "packages/tidystl-compat"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["extra/experiments", "extra/other_tools"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tidystl", "tidystl_compat", "tidystl_simd", "tests"]

[tool.ruff.lint.per-file-ignores]
"packages/tidystl-simd/tests/test_simd_correctness.py" = ["N802"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["packages/tidystl/tests"]
addopts = ["-v", "--strict-markers", "--tb=short", "--import-mode=importlib"]
