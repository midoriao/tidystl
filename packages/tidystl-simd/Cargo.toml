[package]
name = "tidystl-simd"
version = "0.1.0"
edition = "2021"

[lib]
name = "_ext"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1"
wide = "0.7"

[dev-dependencies]
approx = "0.5"
