[project]
name = "tidystl-compat"
version = "0.1.0"
description = "Compatibility backends for tidystl (Breach, TaLiRo, RTAMT, and other tools)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["tidystl>=0.2", "numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.0"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tidystl_compat"]

[tool.hatch.build.targets.sdist]
include = ["tidystl_compat", "tests", "README.md", "LICENSE", "pyproject.toml"]
