[project]
name = "tidystl-compat"
dynamic = ["version"]
description = "Compatibility backends for tidystl (Breach, TaLiRo, RTAMT, and other tools)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["tidystl>=0.2", "numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.0"]

[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

# search_parent_directories: the git root is above this package dir (monorepo).
# no-guess-dev: don't presume the next release version between tags.
[tool.hatch.version.raw-options]
search_parent_directories = true
version_scheme = "no-guess-dev"

[tool.hatch.build.targets.wheel]
packages = ["tidystl_compat"]

[tool.hatch.build.targets.sdist]
include = ["tidystl_compat", "tests", "README.md", "LICENSE", "pyproject.toml"]
