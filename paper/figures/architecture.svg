<svg xmlns="http://www.w3.org/2000/svg" width="760" height="266" viewBox="0 0 760 266" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a4fa0"/>
    </marker>
    <style>
      .t    { font-size: 13.5px; font-weight: 700; fill: #111; }
      .c    { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11px; fill: #333; }
      .cap  { font-size: 10px; fill: #555; }
      .ch   { font-size: 10.5px; fill: #6a4fa0; }
      .lbl  { font-size: 10.5px; fill: #6a4fa0; font-style: italic; }
      .io   { font-size: 10.5px; font-weight: 700; fill: #777; }
      .zone { font-size: 12.5px; font-weight: 700; letter-spacing:.3px; }
    </style>
  </defs>

  <rect width="760" height="266" fill="#ffffff"/>

  <!-- ===== SYSTEM (I/O) BOUNDARY ===== -->
  <rect x="90" y="8" width="580" height="250" rx="12" fill="none" stroke="#9aa0a6" stroke-width="1"/>
  <rect x="94" y="12" width="572" height="242" rx="10" fill="none" stroke="#9aa0a6" stroke-width="1"/>
  <rect x="104" y="3" width="112" height="12" fill="#ffffff"/>
  <text x="108" y="12" class="io">tidySTL · I/O boundary</text>

  <!-- ===== I/O labels ===== -->
  <text x="8" y="62" class="t">STL formula</text>
  <text x="18" y="220" class="t">Signal</text>
  <text x="678" y="220" class="t">Robustness</text>

  <!-- ===== STABLE CORE ===== -->
  <text x="118" y="35" class="zone" fill="#2c5f93">STABLE CORE (shared by every backend)</text>

  <rect x="120" y="48" width="90" height="40" fill="#f1f6fc" stroke="#2c5f93" stroke-width="1.4"/>
  <text x="136" y="73" class="t">Parser</text>

  <rect x="236" y="48" width="116" height="40" fill="#f1f6fc" stroke="#2c5f93" stroke-width="1.4"/>
  <text x="252" y="73" class="t">Formula AST</text>

  <rect x="378" y="48" width="262" height="40" fill="#f1f6fc" stroke="#2c5f93" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="392" y="73" class="t">Stable DAG representation interface</text>

  <!-- ===== API BOUNDARY ===== -->
  <line x1="96" y1="112" x2="664" y2="112" stroke="#9aa0a6" stroke-width="1.4" stroke-dasharray="4,3"/>
  <rect x="108" y="106" width="108" height="12" fill="#ffffff"/>
  <text x="112" y="115" font-size="10.5" font-weight="700" fill="#777">Stable API boundary</text>

  <!-- ===== SWAPPABLE ===== -->
  <text x="118" y="139" class="zone" fill="#6a4fa0">SWAPPABLE (per backend)</text>

  <rect x="124" y="151" width="512" height="42" fill="#efe7fb" stroke="#7a5fb0" stroke-width="1.7"/>
  <text x="138" y="169" class="t">AST-to-DAG conversion rule</text>
  <text x="138" y="185" class="cap">e.g., until decomposition · special operators · CSE</text>

  <line x1="380" y1="193" x2="380" y2="203" stroke="#7a5fb0" stroke-width="1.8"/>

  <rect x="124" y="203" width="512" height="38" fill="#efe7fb" stroke="#7a5fb0" stroke-width="1.7"/>
  <text x="138" y="219" class="t">Computation DAG interpretation</text>
  <text x="138" y="234" class="cap">e.g., signal model · signal processing algorithm · automatic differentiation</text>

  <!-- ===== arrows ===== -->
  <line x1="82" y1="68" x2="118" y2="68" stroke="#222" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="210" y1="68" x2="234" y2="68" stroke="#222" stroke-width="1.8" marker-end="url(#ar)"/>

  <path d="M294,88 V130 H300 V149" fill="none" stroke="#6a4fa0" stroke-width="2" marker-end="url(#arP)"/>

  <path d="M509,88 V130 H460 V149" fill="none" stroke="#2c5f93" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arP)"/>

  <line x1="62" y1="219" x2="122" y2="219" stroke="#6a4fa0" stroke-width="2" marker-end="url(#arP)"/>

  <line x1="636" y1="219" x2="676" y2="219" stroke="#6a4fa0" stroke-width="2" marker-end="url(#arP)"/>
</svg>
