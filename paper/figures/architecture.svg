<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrowBackend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a4fa0"/>
    </marker>
    <marker id="arrowShared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c5f93"/>
    </marker>
    <style>
      .title { font-size: 17px; font-weight: 700; fill: #111; }
      .note  { font-size: 15px; fill: #555; }
      .io    { font-size: 15.5px; font-weight: 700; fill: #333; }
      .zone  { font-size: 16.5px; font-weight: 700; letter-spacing: .3px; }
      .boundary-label { font-size: 14px; font-weight: 700; fill: #777; }
    </style>
  </defs>

  <rect width="760" height="340" fill="#fff"/>

  <!-- tidySTL boundary -->
  <rect x="105" y="10" width="550" height="320" rx="12" fill="none" stroke="#9aa0a6" stroke-width="1.2"/>
  <rect x="121" y="4" width="153" height="14" fill="#fff"/>
  <text x="125" y="15" class="boundary-label">tidySTL · I/O boundary</text>

  <!-- Stable core -->
  <text x="132" y="43" class="zone" fill="#2c5f93">STABLE CORE (shared by every backend)</text>

  <rect x="136" y="55" width="107" height="56" fill="#f1f6fc" stroke="#2c5f93" stroke-width="1.6"/>
  <text x="190" y="88" class="title" text-anchor="middle">Parser</text>

  <rect x="275" y="55" width="134" height="56" fill="#f1f6fc" stroke="#2c5f93" stroke-width="1.6"/>
  <text x="342" y="88" class="title" text-anchor="middle">Formula AST</text>

  <rect x="440" y="55" width="186" height="56" fill="#f1f6fc" stroke="#2c5f93" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="533" y="78" class="title" text-anchor="middle">Shared DAG</text>
  <text x="533" y="97" class="title" text-anchor="middle">primitives</text>

  <!-- Formula input -->
  <text x="9" y="88" class="io">STL formula</text>
  <line x1="98" y1="83" x2="134" y2="83" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="243" y1="83" x2="273" y2="83" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Backend boundary -->
  <line x1="113" y1="142" x2="647" y2="142" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="129" y="134" width="142" height="16" fill="#fff"/>
  <text x="134" y="146" class="boundary-label">Stable API boundary</text>

  <!-- Swappable backend -->
  <text x="132" y="174" class="zone" fill="#6a4fa0">SWAPPABLE (per backend)</text>

  <rect x="134" y="188" width="492" height="55" fill="#efe7fb" stroke="#7a5fb0" stroke-width="1.8"/>
  <text x="154" y="211" class="title">AST-to-DAG conversion rule</text>
  <text x="154" y="231" class="note">until decomposition · special operators · CSE</text>

  <rect x="134" y="263" width="492" height="51" fill="#efe7fb" stroke="#7a5fb0" stroke-width="1.8"/>
  <text x="154" y="285" class="title">DAG node interpretation</text>
  <text x="154" y="305" class="note">signal model · signal processing algorithm · automatic differentiation</text>

  <!-- Backend data flow -->
  <path d="M391,111 V158 H425 V186" fill="none" stroke="#6a4fa0" stroke-width="2.2" marker-end="url(#arrowBackend)"/>
  <line x1="380" y1="243" x2="380" y2="261" stroke="#6a4fa0" stroke-width="2.2" marker-end="url(#arrowBackend)"/>

  <!-- Shared primitives support construction of the backend-specific DAG. -->
  <line x1="533" y1="111" x2="533" y2="186" stroke="#2c5f93" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowShared)"/>

  <!-- Signal input and robustness output -->
  <text x="31" y="294" class="io">Signal</text>
  <line x1="87" y1="289" x2="132" y2="289" stroke="#6a4fa0" stroke-width="2.2" marker-end="url(#arrowBackend)"/>

  <line x1="626" y1="289" x2="662" y2="289" stroke="#6a4fa0" stroke-width="2.2" marker-end="url(#arrowBackend)"/>
  <text x="668" y="294" class="io">Robustness</text>
</svg>
